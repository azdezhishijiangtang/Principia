name: 部署到 GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        # 前端工程在 frontend/ 子目录，所有命令都在这里执行
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: 类型检查
        run: pnpm exec tsc -b
      - name: 构建（base=/Principia/）
        # 直接调 vite 并显式传 --base。不要写成 `pnpm run build -- --base=...`：
        # 那个 `--` 会被 vite 当成选项结束符，导致 base 被忽略、产物资源路径丢前缀。
        run: pnpm exec vite build --base=/Principia/
      - name: SPA 回退（404.html 兜底客户端路由）
        run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          # path 相对仓库根目录
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
