name: Deploy to EdgeOne Pages

# 为什么需要这条流水线：
# GitHub Pages 的 *.github.io 在部分网络环境下不可达或很慢，站点主入口已迁到
# 腾讯 EdgeOne Pages（国内边缘节点 + 支持 SPA 回源）。
# 配置好 EDGEONE_API_TOKEN 后，每次改动前端源码都会自动重新部署，
# 不需要再手动执行脚本。

on:
  # 手动触发：仓库 Actions 页面 → Run workflow
  workflow_dispatch:
  # 前端源码变更时自动部署
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-edgeone.yml'

# 同一时间只跑一个部署，避免并发覆盖
concurrency:
  group: edgeone-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check API token
        id: check
        env:
          TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::warning::未配置 EDGEONE_API_TOKEN，跳过部署。请在仓库 Settings → Secrets and variables → Actions 中添加。"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # 没有配置 token 时直接跳过后续步骤，避免每次 push 都出现失败的红叉
      - name: Install dependencies
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        run: npm install --no-audit --no-fund

      - name: Install EdgeOne CLI
        if: steps.check.outputs.ready == 'true'
        run: npm install -g edgeone

      - name: Build & deploy
        if: steps.check.outputs.ready == 'true'
        working-directory: frontend
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
          EDGEONE_PROJECT: ${{ vars.EDGEONE_PROJECT || 'principia' }}
          EDGEONE_ENV: production
          EDGEONE_AREA: global
        run: node scripts/deploy-edgeone.mjs "ci: deploy ${{ github.sha }}"

      - name: Summary
        if: steps.check.outputs.ready == 'true'
        run: |
          echo "### EdgeOne 部署完成 :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "提交：\`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "访问域名请在 [EdgeOne 控制台](https://console.cloud.tencent.com/edgeone/pages) 查看。" >> "$GITHUB_STEP_SUMMARY"
